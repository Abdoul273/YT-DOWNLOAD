# Déploiement possible, mais YouTube bloque souvent les IP de serveurs :
# l'usage recommandé est en local (./yt-nexus).
services:
  - type: web
    name: yt-nexus
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 1 --threads 32 -b 0.0.0.0:$PORT --timeout 0 app:app
    envVars:
      - key: RENDER
        value: "true"
      - key: PYTHON_VERSION
        value: "3.12"
