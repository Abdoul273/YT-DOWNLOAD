<!doctype html>
<html lang="fr" data-theme="sombre">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#05060d" />
  <title>YT-NEXUS</title>
  <link rel="icon" href="/static/icone.svg" type="image/svg+xml" />
  <link rel="manifest" href="/static/manifest.json" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/app.css" />
  <script>try { const t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch {}</script>
</head>
<body>
  <div class="aurore" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
  <header class="entete verre">
    <div class="logo">
      <img src="/static/icone.svg" alt="" width="30" height="30" />
      <span>YT-<b>NEXUS</b></span>
    </div>
    <nav class="nav" id="nav">
      <span class="indic" aria-hidden="true"></span>
      <button data-vue="video" title="Vidéo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m10 8 6 4-6 4z"/></svg><span class="lib">Vidéo</span></button>
      <button data-vue="recherche" title="Recherche"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><span class="lib">Recherche</span></button>
      <button data-vue="lot" title="Lot"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="14" rx="2"/><path d="M7 3h10M5 5h14"/></svg><span class="lib">Lot</span><span class="pastille" id="pastille-lot" hidden>0</span></button>
      <button data-vue="playlist" title="Playlist"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h13M3 11h13M3 16h8M17 13v8l5-4z"/></svg><span class="lib">Playlist</span></button>
      <span class="sep-nav" aria-hidden="true"></span>
      <button data-vue="en-cours" title="En cours"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0-5-5m5 5 5-5M4 19h16"/></svg><span class="lib">En cours</span><span class="pastille" id="pastille" hidden>0</span></button>
      <button data-vue="fichiers" title="Fichiers"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg><span class="lib">Fichiers</span></button>
      <button data-vue="historique" title="Historique"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span class="lib">Historique</span><span class="pastille rouge" id="pastille-hist" hidden>0</span></button>
      <span class="sep-nav" aria-hidden="true"></span>
      <button data-vue="diagnostics" title="Diagnostics"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg><span class="lib">Diagnostics</span></button>
      <button data-vue="parametres" title="Paramètres"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3m0 14v3M4.2 4.2l2.1 2.1m11.4 11.4 2.1 2.1M2 12h3m14 0h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg><span class="lib">Paramètres</span></button>
    </nav>
    <span class="debit" id="debit" hidden><span class="point"></span><span id="debit-v"></span></span>
    <button class="icone-entete" id="btn-theme" title="Changer de thème" aria-label="Changer de thème"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
  </header>

  <main id="contenu"></main>

  <dialog id="lecteur">
    <div class="tete"><h3 id="lecteur-titre"></h3><button class="icone-btn" data-fermer aria-label="Fermer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
    <video id="lecteur-video" controls playsinline></video>
  </dialog>
  <div class="toasts" id="toasts" aria-live="polite"></div>
  <div class="deposer" id="deposer" hidden>Dépose le lien ici</div>
  <script type="module" src="/static/app.js"></script>
</body>
</html>
